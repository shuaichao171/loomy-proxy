# LoomyProxy 对外入口 —— HTTPS 版（宝塔/Nginx vhost 模板）
#
# 前置：证书已签发到 /www/server/panel/vhost/cert/loomy.shuaichao.xyz/
#   fullchain.pem / privkey.pem（acme.sh --install-cert 或宝塔面板申请都会放这里）
#
# 安装位置：/www/server/panel/vhost/nginx/loomy.shuaichao.xyz.conf
# 与 loomy-proxy.conf 的区别：80 只保留 ACME 验证并跳转 443，业务走 TLS。
#
# 注意顺序：先签证书 → 再启用本文件。否则 nginx 会因找不到证书文件启动失败。

server {
    listen 80;
    server_name loomy.shuaichao.xyz;

    # ACME HTTP-01 验证（Let's Encrypt 续期也要用，不能删）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/loomy.shuaichao.xyz;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name loomy.shuaichao.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/loomy.shuaichao.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/loomy.shuaichao.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:EECDH+AES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;

    # 上了证书再开 HSTS；先别加 includeSubDomains，避免误伤其它子域
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/loomy-proxy.log;
    error_log  /www/wwwlogs/loomy-proxy.error.log;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式对话：必须关闭缓冲，否则 chunk 会被攒住
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header X-Accel-Buffering no;
    }
}

# ---------------- 备用端口（可选，保留 http 便于内网排查） ----------------
server {
    listen 8788;
    server_name _;

    access_log /www/wwwlogs/loomy-proxy-8788.log;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header X-Accel-Buffering no;
    }
}
