# LoomyProxy 对外入口（宝塔/Nginx vhost 模板）
#
# 安装位置：/www/server/panel/vhost/nginx/loomy.shuaichao.xyz.conf
# 上游：容器只绑 127.0.0.1:8787，由 Nginx 反代；SSE 必须关闭缓冲。
#
# 三个入口：
#   1) http(s)://loomy.shuaichao.xyz  —— 需要 DNS A 记录指向本机
#   2) http://<服务器IP>              —— 先用 IP 验证（server_name 改成实际 IP）
#   3) http://<服务器IP>:8788         —— 备用端口（需安全组/防火墙放行）

# ---------------- 域名入口 ----------------
server {
    listen 80;
    server_name loomy.shuaichao.xyz;

    access_log /www/wwwlogs/loomy-proxy.log;
    error_log  /www/wwwlogs/loomy-proxy.error.log;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式对话：必须关闭缓冲，否则 chunk 会被攒住
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header X-Accel-Buffering no;
    }
}

# ---------------- IP 直连入口（DNS 生效前就能用） ----------------
server {
    listen 80;
    server_name 154.40.58.3;

    access_log /www/wwwlogs/loomy-proxy.log;

    client_max_body_size 32m;

    location / {
